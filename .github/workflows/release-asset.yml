name: Attach release asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the bundle to (e.g. v0.45.0)
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Upload dist/supernotify-control-card.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/supernotify-control-card.js --clobber
